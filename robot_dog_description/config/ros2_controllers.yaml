controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    # Position targets (stand-up demo, simple gaits).
    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

    # Torques (RL policy + your own PD loop). Loaded inactive; switch with
    # ros2 control switch_controllers --activate joint_group_effort_controller --deactivate joint_group_position_controller
    joint_group_effort_controller:
      type: effort_controllers/JointGroupEffortController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link

joint_group_position_controller:
  ros__parameters:
    joints: [FL_hip_joint, FL_thigh_joint, FL_calf_joint,
             FR_hip_joint, FR_thigh_joint, FR_calf_joint,
             RL_hip_joint, RL_thigh_joint, RL_calf_joint,
             RR_hip_joint, RR_thigh_joint, RR_calf_joint]

joint_group_effort_controller:
  ros__parameters:
    # rcl's YAML parser has no anchors, so the list is repeated
    joints: [FL_hip_joint, FL_thigh_joint, FL_calf_joint,
             FR_hip_joint, FR_thigh_joint, FR_calf_joint,
             RL_hip_joint, RL_thigh_joint, RL_calf_joint,
             RR_hip_joint, RR_thigh_joint, RR_calf_joint]
